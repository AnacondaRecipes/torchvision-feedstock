{% set version = "0.29.2" %}
# see github.com/conda-forge/conda-forge.github.io/issues/1059 for naming discussion
# torchvision requires that CUDA major and minor versions match with pytorch
# https://github.com/pytorch/vision/blob/fa99a5360fbcd1683311d57a76fcc0e7323a4c1e/torchvision/extension.py#L79C1-L85C1
{% set torch_proc_type = "cuda" ~ cuda_compiler_version | replace('.', '') if gpu_variant == "cuda" else "mps" if gpu_variant == "metal" else "cpu" %}
# Upstream has specific compatability ranges for pytorch and python which are
# updated every 0.x release. https://github.com/pytorch/vision#installation
# Upstream is ABI-stable from torch 2.14.0 (setup.py TORCH_MIN_VERSION); host run_exports may raise the
# packaged runtime floor.
{% set compatible_pytorch = "2.15" %}

# Use a higher build number for the GPU variants, to ensure that they're
# preferred by conda's solver, and they're preferentially
# installed where the platform supports it.
{% set build = 100 if gpu_variant != "cpu" else 0 %}

package:
  name: torchvision
  version: {{ version }}

source:
  - url: https://github.com/pytorch/vision/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 6239575329eb0149ff7a7f5cabfab254129f758961afdba650aab37276d8196d
    patches:
      # https://github.com/pytorch/vision/pull/8406/files#r1730151047
      - patches/0001-Use-system-giflib.patch
      - patches/0002-Force-nvjpeg-and-force-failure.patch
      - patches/0003-dont-test-for-turbo-jpeg.patch
      - patches/0005-use-correct-encode-jpeg-test-dir.patch
      # Backport of pytorch/vision#9717 (c725e823, after v0.29.2): Pillow >= 13 rejects posterize(bits=0), and its
      # vertical-first resize order breaks the PIL reference in TestResize::test_image_correctness.
      - patches/0006-Fix-tests-after-PIL-13.patch
  # MIT license text that the Microsoft notice in csrc/ops/{cpu,cuda}/deform_conv2d_kernel.* points to
  # ("Licensed under The MIT License [see LICENSE for details]"); the file itself doesn't carry it.
  - url: https://raw.githubusercontent.com/msracver/Deformable-ConvNets/6aeda878a95bcb55eadffbe125804e730574de8d/LICENSE
    sha256: f4537a9a339834394f5242176a4ed19b239a88a600bcb02041205f48b3c07dfc
    fn: Deformable-ConvNets-LICENSE.txt
    folder: third_party/licenses

build:
  string: cpu_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}                                                # [gpu_variant == "cpu"]
  string: cuda{{ cuda_compiler_version | replace('.', '') }}py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [gpu_variant == "cuda"]
  string: mps_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}                                                # [gpu_variant == "metal"]
  number: {{ build }}
  # pytorch 2.15 requires python >=3.11 (no py3.10 builds); torchvision itself allows >=3.10.
  skip: true  # [py<311]
  script_env:
    # required by the setup.py script to find the right version in 0.20.1
    - BUILD_VERSION={{ version }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}                   # [gpu_variant == "cuda"]
    - cuda-version {{ cuda_compiler_version }} # [gpu_variant == "cuda"]
    - libcublas-dev                          # [build_platform != target_platform and gpu_variant == "cuda"]
    - libcusolver-dev                        # [build_platform != target_platform and gpu_variant == "cuda"]
    - libcusparse-dev                        # [build_platform != target_platform and gpu_variant == "cuda"]
    - libnvjpeg-dev                          # [build_platform != target_platform and gpu_variant == "cuda"]
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - pytorch ={{ compatible_pytorch }}.*={{ torch_proc_type }}*  # [build_platform != target_platform]
  host:
    - python
    - pip
    - setuptools
    - wheel
    - cuda-version {{ cuda_compiler_version }}   # [gpu_variant == "cuda"]
    - libcublas-dev                              # [gpu_variant == "cuda"]
    - libcusolver-dev                            # [gpu_variant == "cuda"]
    - libcusparse-dev                            # [gpu_variant == "cuda"]
    - libnvjpeg-dev                              # [gpu_variant == "cuda"]
    - cuda-cudart-dev                            # [gpu_variant == "cuda"]
    # split off image/video into separate outputs?
    - libjpeg-turbo {{ libjpeg_turbo }}
    - libpng {{ libpng }}
    # Deliberate lock instead of the CBC libwebp pin: aligns with ffmpeg's libwebp pinning (44759cd).
    - libwebp >=1.6.0,<2.0a0
    # https://github.com/pytorch/vision/pull/8406/files#r1730151047
    - giflib {{ giflib }}
    - pillow >=5.3.0,!=8.3.*
    - libtorch ={{ compatible_pytorch }}.*=*{{ torch_proc_type }}*
    - pytorch ={{ compatible_pytorch }}.*=*{{ torch_proc_type }}*
    # libtorch's torch/csrc/Exceptions.h does #include <pybind11/pybind11.h>;
    # the header is not vendored under libtorch's include tree, so pybind11
    # must be on the host include path. Matches pytorch-feedstock 2.15 pin.
    - pybind11 >=3.0.4,<4
    # pybind11-abi propagates the run_export pin (==11) for cross-module
    # ABI safety with the corresponding pytorch 2.15 build.
    - pybind11-abi ==11
  run:
    - python
    - pytorch ={{ compatible_pytorch }}.*=*{{ torch_proc_type }}*
    - __cuda                                      # [gpu_variant == "cuda"]
    - numpy
    - pillow >=5.3.0,!=8.3.*
  run_constrained:
    # setup.py python_requires excludes 3.14.1; gdown is the only bounded extra (scipy is unbounded).
    - python !=3.14.1
    - gdown >=4.7.3

test:
  requires:
    - pip
  imports:
    - torchvision
    - torchvision.datasets
    - torchvision.models
    - torchvision.transforms
    - torchvision.utils
  commands:
    # use pip list to manually check that the version is correctly reported
    # Otherwise downstream package's pip check may fail
    - pip list
    - pip list | grep torchvision | grep {{ version }}         # [unix]
    - pip check

outputs:
  - name: torchvision
  - name: torchvision-tests
    requirements:
      # `cuda_compiler` here has no build function for this test-only output, but
      # it forces PBP to route the test task to a GPU worker pool that provides
      # the `__cuda` virtual package. Without it the test env can't resolve
      # (torchvision's `run: [__cuda]` is unsatisfiable on the CPU test pool).
      build:
        - {{ compiler('cuda') }}                # [gpu_variant == "cuda"]
    test:
      requires:
        - pytest
        - pytest-socket
        - requests
        - expecttest
        - scipy
        - pytest-mock
        - {{ pin_subpackage('torchvision', exact=True) }}
      source_files:
        - test
        - gallery
        - references
        - pytest.ini
      commands:
        - export PYTORCH_ENABLE_MPS_FALLBACK=1      # [osx and arm64]
        # Disable torch.compile for CUDA tests — cuda.h not in test env
        # TORCHDYNAMO_DISABLE fully disables torch.compile (TORCHINDUCTOR_DISABLE only disables the backend)
        - export TORCHDYNAMO_DISABLE=1               # [gpu_variant == "cuda" and not win]
        - set TORCHDYNAMO_DISABLE=1                  # [gpu_variant == "cuda" and win]
        # aarch64 CUDA test runners have sm_75 GPUs; pytorch's aarch64 CUDA 13.x builds require sm_80+.
        # Hide CUDA so smoke_test stays on the CPU path and still validates imports + CPU ops.
        - export CUDA_VISIBLE_DEVICES=-1            # [gpu_variant == "cuda" and linux and aarch64]
        # Windows (win-64 and win-arm64): since pytorch 2.12, torch.hub.download_url_to_file uses a bare urlopen
        # with no certifi fallback, and on win-64 it hit ssl.SSLError [ASN1: NOT_ENOUGH_DATA] in
        # _load_windows_store_certs downloading the ResNet50 weights for smoke_test_torchvision_resnet50_classify.
        # pytorch 2.15 still uses the bare urlopen (torch/hub.py), so run the offline portions only.
        - python -c "import sys; sys.path.insert(0, 'test'); import smoke_test as st; st.smoke_test_torchvision(); st.smoke_test_torchvision_read_decode(); st.smoke_test_torchvision_decode_jpeg(); print('skipped resnet50_classify on win (cert-store regression)')"  # [win]
        - python test/smoke_test.py  # [not win]
        # NOTE: Do NOT use square brackets in {% set %} strings (e.g. test_name[param]).
        # conda-build's selector parser misinterprets [...] as selectors inside output
        # test sections, causing silent rendering failures on osx-arm64.
        # Use broader patterns (e.g. "test_backward" instead of "test_backward[False-True-mps-0]").
        {% set tests_to_skip = "_not_a_real_test" %}
        {% set tests_to_skip = tests_to_skip + " or test_decode_gif" %}
        # libwebp error message changed: test expects "WebPGetFeatures failed." but newer libwebp returns different string
        {% set tests_to_skip = tests_to_skip + " or (test_decode_bad_encoded_data and decode_webp)" %}  # [win]
        {% set tests_to_skip = tests_to_skip + " or test_mps_error_inputs" %}       # [osx and arm64]
        # Sporadic marginal math errors on MPS backward pass (originally individual variants 0-9)
        {% set tests_to_skip = tests_to_skip + " or (test_backward and False-True-mps)" %}  # [osx and arm64]
        {% set tests_to_skip = tests_to_skip + " or test_nms_float16" %}            # [osx and arm64]
        # DeformConv aot_dispatch_dynamic fails on MPS
        {% set tests_to_skip = tests_to_skip + " or test_aot_dispatch_dynamic" %}   # [osx and arm64]
        {% set tests_to_skip = tests_to_skip + " or test_kernel_bounding_boxes" %}
        # NMS CUDA kernel tensor size mismatch on Windows
        {% set tests_to_skip = tests_to_skip + " or test_nms_gpu or test_autocast" %}  # [win]
        # TestErase value=random has tiny (<2%) pixel mismatch on osx-arm64 with pytorch RNG
        {% set tests_to_skip = tests_to_skip + " or (test_transform_image_correctness and value-random)" %}  # [osx and arm64]
        # XYWHR (rotated bbox) CUDA float32 exceeds upstream's tight tolerance (abs 3.7e-4 vs 1e-5)
        {% set tests_to_skip = tests_to_skip + " or (test_transform_bounding_boxes_correctness and XYWHR)" %}  # [gpu_variant == "cuda"]
        # New in 0.27.0: TestRotatedBoxIou::test_iou xyxyxyxy float32 exceeds upstream tolerance on aarch64 (gcc 15.2.0 CPU fp32). xywhr & float64 pass.
        {% set tests_to_skip = tests_to_skip + " or (test_iou and xyxyxyxy-dtype0)" %}  # [linux and aarch64]
        # uint8 BILINEAR resize scripted-vs-eager off by 1 on win-arm64: upstream picks the native uint8 kernel when
        # platform.machine() is "aarch64"/"arm64", but Windows reports "ARM64", so eager takes the float path.
        {% set tests_to_skip = tests_to_skip + " or (TestResize and test_kernel_image and dtype1 and BILINEAR and not memory_format and not BILINEAR-17)" %}  # [win and arm64]
        {% set tests_to_skip = tests_to_skip + " or (TestResize and test_kernel_video) or (TestResizedCrop and test_kernel and (make_image or make_video))" %}  # [win and arm64]
        # New with pytorch 2.14: this test drives torch.compile/TorchInductor, which JIT-compiles C++ at
        # runtime and needs a working C++ compiler; the conda test env ships none (InvalidCxxCompiler: None/g++).
        {% set tests_to_skip = tests_to_skip + " or test_deform_conv2d_padding_symint" %}
        - pytest --disable-socket --verbose --durations=50 -k "not ({{ tests_to_skip }})" test/test_image.py
        - pytest --disable-socket --verbose --durations=50 -k "not ({{ tests_to_skip }})" test/test_transforms_v2.py
        - pytest --disable-socket --verbose --durations=50 -k "not ({{ tests_to_skip }})" test/test_datasets.py
        - pytest --disable-socket --verbose --durations=50 -k "not ({{ tests_to_skip }})" test/test_ops.py

about:
  home: https://pytorch.org/
  # Compiled sources also carry third-party notices: OpenCV/Intel (BSD-3-Clause, io/image/cpu/exif.h) and
  # Caffe (BSD-2-Clause) + Microsoft Deformable ConvNets (MIT) in ops/{cpu,cuda}/deform_conv2d_kernel.*.
  license: BSD-3-Clause AND BSD-2-Clause AND MIT
  license_family: Other
  license_file:
    - LICENSE
    - torchvision/csrc/io/image/cpu/exif.h
    - torchvision/csrc/ops/cpu/deform_conv2d_kernel.cpp
    - third_party/licenses/Deformable-ConvNets-LICENSE.txt
  summary: Image and video datasets and models for torch deep learning
  description: |
    The torchvision package consists of popular datasets, model architectures, and common image transformations for computer vision.
  dev_url: https://github.com/pytorch/vision
  doc_url: https://docs.pytorch.org/vision/stable/index.html

extra:
  recipe-maintainers:
    - katietz
    - jjhelmus
    - nehaljwani
    - hmaarrfk
    - h-vetinari
